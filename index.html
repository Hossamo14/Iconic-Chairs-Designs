<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconic-Chair-Designs</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <h1>20 Most Iconic Chair Designs in Furniture Design History</h1>
    <div class="boxContainer">
        <span class="chair-id">0</span>
        <div class="chairName">Most Iconic Chair Designs</div>
        <div class="imgContainer">
            <img class="chairImg" src="/chairs/background.png" alt="">
        </div>
        <div>
            <span class="author">....</span>
            <span class="year">....</span>
        </div>
        <p class="textNote">“Form follows function – that has been misunderstood. Form and function should be one,
            joined in a spiritual union.” Frank Lloyd Wright
        </p>
        <div class="buttons">

            <span class="iconContainer ">
                <svg class="icon generate">
                    <use href="sprite.svg#double-arrow"></use>
                </svg>
            </span>

            <button class="auto">Auto Generate</button>
            <button class="stop">Stop Generate</button>
        </div>
        <span class="iconContainer">
            <svg class="musicIcon">
                <use href="sprite.svg#music-off"></use>
            </svg>
        </span>

        <audio class="audio" src="/music-track.mp3"></audio>
    </div>
    <div class="auto-status"></div>
    <script src="main.js"></script>
</body>

</html>
